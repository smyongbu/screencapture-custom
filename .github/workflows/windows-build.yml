name: Windows 云端构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/toolbar-scale

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Visual Studio 编译环境
        uses: microsoft/setup-msbuild@v2

      - name: 固定并下载依赖
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          git clone --filter=blob:none https://github.com/xland/Ling.git deps/Ling
          git -C deps/Ling checkout 26f27d361174f835df43d936c91fe75e1b3c0ad0
          git clone --filter=blob:none --branch 1.34.0 https://github.com/ImageOptim/gifski.git deps/gifski

          # Ling 当前工程依赖作者的解决方案目录语义，并使用了 VS 2026 才能接受的宏写法。
          # GitHub 的 VS 2022 构建机上做两个最小、可审计的临时兼容修复。
          $yogaProject = 'deps/Ling/yoga/yoga.vcxproj'
          $yogaXml = Get-Content -Raw -LiteralPath $yogaProject
          $yogaXml = $yogaXml.Replace('$(SolutionDir)', '$(ProjectDir)..\')
          Set-Content -LiteralPath $yogaProject -Value $yogaXml -Encoding utf8

          $utilHeader = 'deps/Ling/include/Util.h'
          $utilText = Get-Content -Raw -LiteralPath $utilHeader
          $oldLine = 'return chars[(s >> (idx * 3)) % chars.size()];'
          $newLine = 'return std::wstring_view(L"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz")[(s >> (idx * 3)) % 62];'
          if (-not $utilText.Contains($oldLine)) { throw 'Ling 兼容补丁目标不存在' }
          Set-Content -LiteralPath $utilHeader -Value $utilText.Replace($oldLine, $newLine) -Encoding utf8
          ./Build/patch-ling.ps1

      - name: 编译 gifski
        working-directory: deps/gifski
        run: cargo build --release --lib --locked

      - name: 编译 Ling 和 Yoga
        shell: pwsh
        run: |
          msbuild deps/Ling/yoga/yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OutDir="$env:GITHUB_WORKSPACE\deps\Ling\x64\Release\"
          msbuild deps/Ling/Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: 编译截图工具
        shell: pwsh
        run: msbuild Src/ScreenCapture.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: 整理成品
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter ScreenCapture.exe | Where-Object { $_.FullName -notlike '*\\deps\\*' } | Select-Object -First 1
          if (-not $exe) { throw '没有找到 ScreenCapture.exe' }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination artifact/截屏工具.exe
          Get-FileHash artifact/截屏工具.exe -Algorithm SHA256 | Format-List

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 截屏工具-Windows-x64
          path: artifact/截屏工具.exe
          if-no-files-found: error
          retention-days: 14
